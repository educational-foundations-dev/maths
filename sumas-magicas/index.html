<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sumas Mágicas v4.1</title>
<style>
:root{--bg:#fff4d6;--card:#fff;--ink:#2a2550;--r:#ff6b6b;--b:#3d9bff;--g:#2fbf71;--y:#ffc93c;--p:#8a63f2;--ln:#eadbb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1b3a;--card:#2c2858;--ink:#f6f2ff;--ln:#4b4585}}
:root[data-theme="dark"]{--bg:#1e1b3a;--card:#2c2858;--ink:#f6f2ff;--ln:#4b4585}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Fredoka","Trebuchet MS",system-ui,sans-serif;font-size:18px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:10px 12px 40px}
header{display:flex;align-items:center;gap:10px}
header b{font-size:26px;flex:1}
header .sp{margin-left:auto}
.pill{background:var(--card);border-radius:20px;padding:4px 12px;font-weight:700;border:3px solid var(--y)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.card{background:var(--card);border-radius:24px;padding:14px;border:3px solid var(--ln);margin:10px 0}
#panel{min-height:170px;text-align:center}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.grp{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:8px;border-radius:18px;min-width:70px;transition:all .5s}
.g1{background:#ff6b6b30}.g2{background:#3d9bff30}
.it{font-size:34px;position:relative;display:inline-block;animation:pop .5s backwards;animation-delay:var(--d);cursor:pointer;transition:transform .2s}
.it.on{transform:scale(1.25)}
.it.on::after{content:attr(data-n);position:absolute;right:-4px;top:-8px;background:var(--p);color:#fff;font-size:14px;border-radius:50%;width:22px;height:22px;line-height:22px;font-weight:800}
.op{font-size:40px;font-weight:800}
.row.joined .grp{background:#2fbf7130;margin:0 -10px}.row.joined .op.p{opacity:0;width:0;overflow:hidden}
.eq{font-size:34px;font-weight:800;margin-top:4px}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:4px 0}
nav button{flex:1;background:var(--card);border:3px solid var(--ln);border-radius:18px;padding:6px 2px;font-size:26px;line-height:1.1}
nav button small{display:block;font-size:12px;font-weight:700}
nav button.act{border-color:var(--p);background:var(--p);color:#fff;transform:translateY(-2px)}
.sec{display:none}.sec.act{display:block}
.pk{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin:6px 0}
.pk button,.big{min-width:46px;height:46px;border-radius:14px;background:var(--card);border:3px solid var(--ln);font-weight:800;font-size:22px;padding:0 8px}
.pk .sel{background:var(--y);border-color:var(--y);color:#2a2550}
.pk.a .sel{background:var(--r);color:#fff;border-color:var(--r)}.pk.b .sel{background:var(--b);color:#fff;border-color:var(--b)}
.go{background:var(--g);color:#fff;border-radius:18px;padding:10px 20px;font-size:22px;font-weight:800;box-shadow:0 4px 0 #1d8a50;margin:4px}
.go:active{transform:translateY(3px);box-shadow:none}
.go.o{background:var(--y);color:#2a2550;box-shadow:0 4px 0 #c99a10}
.msg{min-height:36px;font-size:22px;font-weight:700;text-align:center}
.track{position:relative;height:110px;margin:0 22px}
.track::after{content:"";position:absolute;left:0;right:0;bottom:30px;height:6px;background:var(--ink);border-radius:3px}
.tk{position:absolute;bottom:0;width:0;height:60px}
.tk u{position:absolute;left:-2px;bottom:28px;width:4px;height:10px;background:var(--ink);z-index:1}
.tk s{position:absolute;left:-12px;width:24px;bottom:4px;text-align:center;text-decoration:none;font-weight:800;font-size:15px}
.tk.hit s{color:#fff;background:var(--b);border-radius:8px;transform:scale(1.2)}
.tk.end s{background:var(--g)}
.frog{position:absolute;bottom:34px;transition:left .5s ease;width:0;z-index:2}
.frog span{position:absolute;left:-20px;bottom:0;font-size:36px}
.frog.hop span{animation:hop .5s}
@keyframes hop{50%{transform:translateY(-44px) rotate(-12deg)}}
.arc{position:absolute;bottom:35px;height:26px;border:4px solid var(--b);border-bottom:0;border-radius:50% 50% 0 0/100% 100% 0 0;animation:grow .4s}
@keyframes grow{from{opacity:0;transform:scaleY(0)}}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zone{min-height:110px;border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center}
.zone.l{background:#ff6b6b30}.zone.r{background:#3d9bff30}
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.opt{min-width:84px;height:84px;font-size:42px;font-weight:800;border-radius:22px;background:var(--y);color:#2a2550;box-shadow:0 5px 0 #c99a10}
.opt:nth-child(2){background:#9ee6b8;box-shadow:0 5px 0 #5fb985}.opt:nth-child(3){background:#b9d8ff;box-shadow:0 5px 0 #7aa6dd}.opt:nth-child(4){background:#e3d2ff;box-shadow:0 5px 0 #a98ae0}
.opt:active{transform:translateY(4px)}
.opt.ok{background:var(--g)!important;color:#fff;animation:pop .5s}
.opt.no{opacity:.35;transform:scale(.9)}
.opt:disabled{cursor:default}
.rods{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;min-height:60px}
.rod{display:flex;gap:2px;padding:3px;border-radius:8px;background:var(--c)}
.rod i{width:20px;height:24px;background:#ffffff55;border-radius:4px;border:2px solid #0002}
.bignum{font-size:56px;font-weight:800;text-align:center}
.bar{height:14px;background:var(--ln);border-radius:7px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--g);width:100%}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-weight:800}
label{font-weight:700}
input[type=checkbox]{width:24px;height:24px;vertical-align:middle;accent-color:var(--p)}
input[type=range]{width:150px;vertical-align:middle;accent-color:var(--p)}
.cf{position:fixed;top:-30px;font-size:30px;pointer-events:none;animation:fall 1.6s ease-in forwards;z-index:9}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
button:focus-visible,input:focus-visible{outline:4px solid var(--p);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
.sp{display:flex;flex-direction:column;align-items:center;gap:4px}.sp select{font:inherit;font-size:13px;border-radius:10px;border:2px solid var(--ln);background:var(--card);color:var(--ink)}
#dg .sel{background:var(--p);border-color:var(--p);color:#fff}
.stp{display:flex;align-items:center;gap:4px;justify-content:center;flex-wrap:wrap;margin:6px 0}.stp button{min-width:44px;height:40px;border-radius:12px;background:var(--card);border:3px solid var(--ln);font-weight:800;font-size:15px}
.stp .v{min-width:80px;font-size:36px;font-weight:800;text-align:center}.stp.a .v{color:var(--r)}.stp.b .v{color:var(--b)}
.blk{display:flex;flex-wrap:wrap;align-items:flex-end;gap:3px;justify-content:center}.blk b{display:block;border-radius:3px}
.h{width:34px;height:34px;background:var(--b)}.tn{width:10px;height:34px;background:var(--g)}.ones{display:flex;flex-wrap:wrap;gap:2px;width:34px}.u{width:10px;height:10px;background:var(--y)}
.opt{padding:0 14px}.rods .pl{font-size:30px}.cub{display:flex;flex-wrap:wrap;gap:3px;width:100%;justify-content:center;margin-top:6px}.cub i{width:18px;height:18px;border-radius:5px}.cub em{width:14px}
#s5 .rods{min-height:90px}#s5 .bignum{font-size:64px}
.arc b{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:13px;font-style:normal;white-space:nowrap}
.track{margin-bottom:24px}.track.big .tk s{left:-22px;width:44px;font-size:12px}.tk.x s{bottom:-20px}
.zone .blk b{cursor:pointer;animation:pop .35s backwards}.zone .tn{width:14px}.zone .u{width:14px;height:14px}

/* v4.2 · misma familia visual que el applet de numeración */
button{min-height:48px;touch-action:manipulation}.pk button,.big{min-width:52px;height:52px}.stp button{min-width:52px;height:46px}
nav{flex-wrap:wrap}nav button{min-width:104px;min-height:62px}
.helpmini{font-size:15px;font-weight:700;opacity:.82;text-align:center;margin:4px 0 8px}
.placeboard{display:grid;gap:8px;margin:10px 0}.placeboard.two{grid-template-columns:repeat(2,1fr)}.placeboard.three{grid-template-columns:repeat(3,1fr)}
.pvcol{border:3px solid var(--ln);border-radius:20px;min-height:190px;padding:8px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:7px;transition:.25s}
.pvcol.target{border-color:var(--g);box-shadow:0 0 0 4px #2fbf7125;transform:translateY(-2px)}
.pvhead{width:100%;border-radius:14px;padding:7px 4px;text-align:center;font-weight:900}.pvc .pvhead{background:#3d9bff25}.pvd .pvhead{background:#2fbf7125}.pvu .pvhead{background:#ffc93c45}
.pvname{display:block;font-size:14px}.pvcount{font-size:30px;line-height:1}
.pvtray{width:100%;min-height:74px;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:5px;padding:5px}
.pvu .pvtray{display:grid;grid-template-columns:repeat(10,16px);grid-auto-rows:16px;justify-content:center;align-content:start}
.pvpiece{display:block;border:3px solid transparent;cursor:pointer;transition:.18s;animation:pop .25s backwards}.pvpiece.sel3{border-color:var(--p);transform:scale(1.13);filter:brightness(1.05)}
.pvpiece.c{width:38px;height:38px;background:var(--b);border-radius:5px}.pvpiece.d{width:12px;height:42px;background:var(--g);border-radius:4px}.pvpiece.u{width:16px;height:16px;background:var(--y);border-radius:4px}
.pvactions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.pvactions button{font-size:14px;min-height:42px;border:3px solid var(--ln);background:var(--card);border-radius:13px;padding:5px 8px;font-weight:800}.pvactions button:disabled{opacity:.35;cursor:default}
.groupaction{width:100%;margin:7px 0 2px}.equiv{font-size:18px;font-weight:900;text-align:center;min-height:28px}
.tenhint{display:grid;grid-template-columns:repeat(10,13px);gap:3px;justify-content:center;margin:5px auto}.tenhint i{width:13px;height:13px;background:var(--y);border-radius:3px}
.alg{max-width:520px;margin:10px auto}
.colcoach{max-width:560px;margin:0 auto}
.hintbox{background:#fff8d8;border:3px solid var(--y);border-radius:18px;padding:10px 12px;margin:10px auto;display:flex;gap:9px;align-items:flex-start;text-align:left;max-width:520px}
.hintbadge{background:var(--y);color:#2a2550;border-radius:12px;padding:4px 8px;font-weight:900;white-space:nowrap;font-size:14px}.hinttext{font-weight:800;line-height:1.25;flex:1}.hintstep{display:block;font-size:13px;opacity:.72;margin-bottom:2px}
.alggrid6{--cols:2;display:grid;grid-template-columns:44px repeat(var(--cols),64px);gap:5px;justify-content:center;align-items:center;margin:8px auto}
.algcell6{height:58px;border-radius:13px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;position:relative}.algcell6.hdr6{height:34px;font-size:13px}.algcell6.sign6{background:transparent;font-size:30px}.algcell6.carry6{height:48px;background:#8a63f214}.algcell6.line6{height:7px;border-radius:4px;background:var(--ink)}.algcell6.blank6{background:transparent}.algcell6.active6{box-shadow:0 0 0 4px var(--y);z-index:1}
.algcell6.place-u{background:#ffc93c35}.algcell6.place-d{background:#2fbf711f}.algcell6.place-c{background:#3d9bff1f}.algcell6.place-m{background:#8a63f21a}.algcell6.carry6.place-u,.algcell6.carry6.place-d,.algcell6.carry6.place-c,.algcell6.carry6.place-m{background:#8a63f214}
.algin6{width:50px;height:50px;border:3px solid var(--ln);border-radius:12px;background:var(--card);color:var(--ink);text-align:center;font:900 30px/1 inherit;padding:0;appearance:textfield}.algin6::-webkit-outer-spin-button,.algin6::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.algin6:focus{border-color:var(--p);outline:3px solid #8a63f22f}.algin6.right6{border-color:var(--g);background:#2fbf7122;color:#167a43}.algin6.wrong6{border-color:var(--r);background:#ff6b6b20;color:#b52e2e;animation:shake6 .28s}.algin6:disabled{opacity:1;-webkit-text-fill-color:currentColor}.algin6.wait6{opacity:.45}
@keyframes shake6{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.collegend{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:5px 0 8px;font-size:13px;font-weight:800}.collegend span{padding:4px 8px;border-radius:10px}.collegend .lu{background:#ffc93c35}.collegend .ld{background:#2fbf711f}.collegend .lc{background:#3d9bff1f}.collegend .lm{background:#8a63f21a}
.colfeedback{min-height:34px;text-align:center;font-weight:900;font-size:18px;margin-top:6px}.colfeedback.bad{color:#b52e2e}.colfeedback.good{color:#167a43}
.strat{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.strat button{border:3px solid var(--ln);background:var(--card);border-radius:14px;padding:6px 10px;font-size:15px;font-weight:800}.strat button.sel{border-color:var(--p);background:var(--p);color:#fff}
@media(max-width:560px){header{flex-wrap:wrap}header b{font-size:22px}.wrap{padding-left:8px;padding-right:8px}nav button{min-width:30%;font-size:23px}.pvcol{min-height:170px}.pvu .pvtray{grid-template-columns:repeat(10,14px);gap:2px}.pvpiece.u{width:14px;height:14px}.placeboard.three{grid-template-columns:1fr 1fr}.placeboard.three .pvu{grid-column:1/-1}.alggrid6{grid-template-columns:36px repeat(var(--cols),56px);gap:4px}.algcell6{height:54px;font-size:28px}.algin6{width:46px;height:46px;font-size:27px}.msg{font-size:19px}}

</style>
</head>
<body>
<div class="wrap">
<header><b></b><div class="sp"><button class="pill" id="mu" aria-label="sound">🔊</button><select id="lang" aria-label="language"><option value="es">Castellano</option><option value="va">Valencià</option><option value="en">English</option></select></div></header>
<div class="pk" id="dg"><span class="pill"></span><button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button></div>
<div class="card" id="panel" aria-live="polite"></div>
<nav id="nav">
<button data-s="1">🍎<small>Juntar</small></button><button data-s="2">🐸<small>Recta</small></button><button data-s="3">🧩<small>Partes</small></button><button data-s="6">🧮<small>Columnas</small></button><button data-s="4">🎮<small>Juego</small></button><button data-s="5">⚡<small>Rápido</small></button>
</nav>

<section class="sec card" id="s1">
<div class="pk a" id="p1a"></div><div class="pk b" id="p1b"></div>
<div class="row"><button class="go o" id="c1">👆 Contar</button><button class="go" id="j1">🤝 Juntar</button></div>
<div class="msg" id="m1">Toca los objetos para contarlos</div>
</section>

<section class="sec card" id="s2">
<div class="pk"><label><input type="checkbox" id="big2"> 🚀 hasta 20</label></div>
<div class="pk a" id="p2a"></div><div class="pk b" id="p2b"></div>
<div class="track" id="trk"></div>
<div class="row"><button class="go" id="g2">🐸 ¡Salta!</button><button class="go o" id="new2">🎲 Otra suma</button></div>
<div class="msg" id="m2"></div>
</section>

<section class="sec card" id="s3">
<div class="pk" id="p3"></div>
<div class="zones" id="z3"><div class="zone l" id="zl"></div><div class="zone r" id="zr"></div></div>
<div class="msg" id="m3"></div>
<div class="pk" id="pairs"></div>
<div class="msg" style="font-size:16px">Toca un objeto para cambiarlo de lado 👆</div>
</section>


<section class="sec card" id="s6">
<div class="pk a" id="p6a"></div><div class="pk b" id="p6b"></div>
<div class="colcoach">
  <div class="hintbox" id="hint6"><span class="hintbadge">💡 Pista</span><div class="hinttext" id="hint6text"></div></div>
  <div class="collegend" id="legend6"></div>
  <div class="alg" id="alg6"></div>
  <div class="row"><button class="go" id="go6">✅ Comprobar</button><button class="go o" id="new6">🎲 Otra suma</button></div>
  <div class="colfeedback" id="fb6" aria-live="polite"></div>
</div>
<div class="msg" id="m6"></div>
</section>

<section class="sec card" id="s4">
<div class="stats"><span id="s4l">🌱 Nivel 1</span><span id="s4s">⭐ 0</span><span id="s4m">🏅 —</span></div>
<div class="msg" id="m4">¿Cuántos hay en total?</div>
<div class="opts" id="o4"></div>
</section>

<section class="sec card" id="s5">
<div class="pk"><label><input type="checkbox" id="hint5" checked> 👁 Ayudas</label><label>⏱ <input type="range" id="tm5" min="3" max="30" value="10"> <b id="tv5">10</b>s</label></div>
<div class="row"><button class="go" id="go5">▶ Empezar</button></div>
<div id="g5" style="display:none">
<div class="bar"><i id="br5"></i></div>
<div class="stats"><span id="s5s">🏆 0</span><span id="s5r">🔥 0</span></div>
<div class="rods" id="rd5"></div>
<div class="bignum" id="q5"></div>
<div class="opts" id="o5"></div>
<div class="msg" id="m5"></div>
</div>
</section>
</div>

/* Apartado 2: recta · escala local, bloques y voz sincronizada */

  if(g){lo=1;hi=CAP()-1;a2=Math.max(lo,Math.min(hi,a2));b2=Math.max(1,Math.min(CAP()-a2,b2));bh=CAP()-a2}
  else{M=$('#big2').checked?20:10;a2=Math.max(0,Math.min(a2,M-1));b2=Math.max(1,Math.min(M-a2,b2));hi=M-1;bh=M-a2}

  const end=a2+b2,step=!g?1:lineStep2();lineLo=!g?0:Math.floor(a2/step)*step;lineHi=!g?M:Math.ceil(end/step)*step;if(lineHi===lineLo)lineHi=lineLo+step;

  $('#trk').className='track'+(g?' big':'');$('#trk').innerHTML=h+`<div class="frog" id="frog" style="left:${p2(a2)}%"><span>🐸</span></div>`;mark(a2,'hit');

function group3(k){if(k===2&&sel3[2].size===10){st3[2]-=10;st3[1]++;clearSel3();ok();say(lang==='en'?'ten ones make one ten':lang==='va'?'deu unitats fan una desena':'diez unidades forman una decena');draw3g('10 U = 1 D ✓')}else if(k===1&&D===3&&sel3[1].size===10){st3[1]-=10;st3[0]++;clearSel3();ok();say(lang==='en'?'ten tens make one hundred':lang==='va'?'deu desenes fan una centena':'diez decenas forman una centena');draw3g('10 D = 1 C ✓')}else soft()}
$('#s3').addEventListener('click',e=>{const it=e.target.closest('.zone .it');if(!it||D>1)return;const i=+it.dataset.i;sides[i]=sides[i]?0:1;pop(i);draw3()});
$('#s3').addEventListener('click',e=>{if(D===1)return;const br=e.target.closest('[data-break]');if(br){break3(+br.dataset.break);return}const gp=e.target.closest('[data-group]');if(gp){group3(+gp.dataset.group);return}const b=e.target.closest('.pvpiece');if(b){const k=+b.dataset.k,i=+b.dataset.i;if(sel3[k].has(i))sel3[k].delete(i);else sel3[k].add(i);pop(sel3[k].size);draw3g();return}const dest=e.target.closest('[data-dest]');if(dest){const k=+dest.dataset.dest;if(k===1&&sel3[2].size===10)group3(2);else if(k===0&&sel3[1].size===10)group3(1)}});

/* Apartado 6: suma en columnas guiada · el niño escribe y la máquina corrige */
let a6=7,b6=5,step6=0,done6=false,tries6=0;
const digitAt=(n,p)=>Math.floor(n/10**p)%10;
const place6=p=>['U','D','C','M'][p]||'';
const placeName6=p=>{
  const names={es:['unidades','decenas','centenas','unidades de millar'],va:['unitats','desenes','centenes','unitats de miler'],en:['ones','tens','hundreds','thousands']};
  return names[lang][p]||'';
};
function calc6(){
  const ans=a6+b6, max=Math.max(String(a6).length,String(b6).length,String(ans).length), steps=[];
  let carry=0;
  for(let p=0;p<max;p++){
    const da=digitAt(a6,p),db=digitAt(b6,p),sum=da+db+carry,out=sum%10,next=Math.floor(sum/10);
    steps.push({p,da,db,carryIn:carry,sum,out,carryOut:next});carry=next;
  }
  return {ans,max,steps};
}
function activeStep6(){return calc6().steps[Math.min(step6,calc6().steps.length-1)]}
function random6(){
  if(D===1){a6=rnd(1,9);b6=rnd(1,9)}
  else if(D===2){a6=rnd(10,89);b6=rnd(1,99-a6)}
  else{a6=rnd(100,899);b6=rnd(1,999-a6)}
  r6();
}
function r6(){
  const lo=D>1?10**(D-1):1,hi=10**D-1;
  if(D===1){a6=Math.max(1,Math.min(9,a6));b6=Math.max(1,Math.min(9,b6));sel($('#p6a'),'a',a6,1,9,v=>{a6=v;r6()});sel($('#p6b'),'b',b6,1,9,v=>{b6=v;r6()})}
  else{a6=Math.max(lo,Math.min(hi-1,a6));b6=Math.max(1,Math.min(hi-a6,b6));sel($('#p6a'),'a',a6,lo,hi-1,v=>{a6=v;r6()});sel($('#p6b'),'b',b6,1,hi-a6,v=>{b6=v;r6()})}
  step6=0;done6=false;tries6=0;$('#go6').textContent=t('check');$('#new6').textContent=t('another');draw6();updateHint6();$('#fb6').textContent='';$('#fb6').className='colfeedback';$('#m6').textContent=tx('Escribe tú las cifras. No se corrige hasta que pulses Comprobar.','Escriu tu les xifres. No es corregix fins que premes Comprovar.','Write the digits yourself. Nothing is marked until you press Check.');
}
function hintText6(st){
  const p=st.p, where=placeName6(p);
  const first= p===0?tx('Empieza por las unidades.','Comença per les unitats.','Start with the ones.'):tx(`Ahora trabaja con las ${where}.`,`Ara treballa amb les ${where}.`,`Now work with the ${where}.`);
  if(st.sum>=10 && p<calc6().max-1){
    return `${first} ${tx(`Suma ${st.da} + ${st.db}${st.carryIn?' + '+st.carryIn:''}. Si formas 10 o más, escribe abajo solo las ${where} que quedan y coloca 1 en la columna de la izquierda.`,`Suma ${st.da} + ${st.db}${st.carryIn?' + '+st.carryIn:''}. Si formes 10 o més, escriu baix només les ${where} que queden i posa 1 en la columna de l’esquerra.`,`Add ${st.da} + ${st.db}${st.carryIn?' + '+st.carryIn:''}. If you make 10 or more, write only the ${where} left below and put 1 in the column to the left.`)}`;
  }
  return `${first} ${tx(`Suma ${st.da} + ${st.db}${st.carryIn?' + '+st.carryIn:''}. Escribe el resultado en su columna.`,`Suma ${st.da} + ${st.db}${st.carryIn?' + '+st.carryIn:''}. Escriu el resultat en la seua columna.`,`Add ${st.da} + ${st.db}${st.carryIn?' + '+st.carryIn:''}. Write the result in its column.`)}`;
}
function updateHint6(){
  const c=calc6(),st=activeStep6();
  if(done6){$('#hint6text').innerHTML=`<span class="hintstep">${tx('Suma terminada','Suma acabada','Sum complete')}</span>${tx('¡Has completado el algoritmo en columnas!','Has completat l’algoritme en columnes!','You completed the column algorithm!')}`;return}
  $('#hint6text').innerHTML=`<span class="hintstep">${tx('Paso','Pas','Step')} ${step6+1} ${tx('de','de','of')} ${c.steps.length} · ${place6(st.p)}</span>${hintText6(st)}`;
}
function draw6(){
  const c=calc6(), cols=[...Array(c.max).keys()].reverse(), st=activeStep6();
  const places=['U','D','C','M'];
  $('#legend6').innerHTML=cols.map(p=>`<span class="l${places[p].toLowerCase()}">${places[p]} · ${placeName6(p)}</span>`).join('');
  const cellClass=p=>`algcell6 place-${places[p].toLowerCase()} ${!done6&&p===st.p?'active6':''}`;
  let h=`<div class="alggrid6" style="--cols:${cols.length}">`;
  h+='<div class="algcell6 blank6"></div>'+cols.map(p=>`<div class="algcell6 hdr6 place-${places[p].toLowerCase()}">${places[p]}</div>`).join('');
  h+=`<div class="algcell6 hdr6 blank6">${tx('llevo','porte','carry')}</div>`+cols.map(p=>{
    if(p===0)return '<div class="algcell6 carry6 blank6"></div>';
    const prev=c.steps[p-1], expected=prev?prev.carryOut:0, needed=expected>0;
    const unlocked=done6 || p<=step6+1;
    return `<div class="algcell6 carry6 place-${places[p].toLowerCase()} ${!done6&&needed&&p===st.p+1?'active6':''}">${needed?`<input class="algin6 carryinput6 ${unlocked?'':'wait6'}" data-kind="carry" data-pos="${p}" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="${tx('llevada','portada','carry')} ${places[p]}" ${unlocked?'':'disabled'}>`:''}</div>`;
  }).join('');
  h+='<div class="algcell6 sign6 blank6"></div>'+cols.map(p=>`<div class="${cellClass(p)}">${digitAt(a6,p)||p<String(a6).length?digitAt(a6,p):''}</div>`).join('');
  h+='<div class="algcell6 sign6 blank6">+</div>'+cols.map(p=>`<div class="${cellClass(p)}">${digitAt(b6,p)||p<String(b6).length?digitAt(b6,p):''}</div>`).join('');
  h+='<div class="algcell6 blank6"></div>'+cols.map(()=>'<div class="algcell6 line6"></div>').join('');
  h+='<div class="algcell6 sign6 blank6">=</div>'+cols.map(p=>`<div class="algcell6 place-${places[p].toLowerCase()} ${!done6&&p===st.p?'active6':''}"><input class="algin6 resinput6 ${p<=step6||done6?'':'wait6'}" data-kind="res" data-pos="${p}" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="${tx('resultado','resultat','result')} ${places[p]}" ${p<=step6||done6?'':'disabled'}></div>`).join('');
  h+='</div>';$('#alg6').innerHTML=h;
  // Preserve already validated values when advancing/redrawing.
  for(let p=0;p<step6;p++){
    const rs=$(`#alg6 .resinput6[data-pos="${p}"]`); if(rs){rs.value=c.steps[p].out;rs.classList.add('right6');rs.disabled=true}
    if(c.steps[p].carryOut){const cr=$(`#alg6 .carryinput6[data-pos="${p+1}"]`);if(cr){cr.value=c.steps[p].carryOut;cr.classList.add('right6');cr.disabled=true}}
  }
  if(done6){
    cols.forEach(p=>{const rs=$(`#alg6 .resinput6[data-pos="${p}"]`);if(rs){rs.value=digitAt(c.ans,p);rs.classList.add('right6');rs.disabled=true}});
    c.steps.forEach(x=>{if(x.carryOut){const cr=$(`#alg6 .carryinput6[data-pos="${x.p+1}"]`);if(cr){cr.value=x.carryOut;cr.classList.add('right6');cr.disabled=true}}});
  }
  $$('#alg6 .algin6').forEach(inp=>inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);inp.classList.remove('wrong6');$('#fb6').textContent='';$('#fb6').className='colfeedback'}));
}
function check6(){
  if(done6){random6();return}
  const c=calc6(),st=activeStep6(), targets=[];
  const r=$(`#alg6 .resinput6[data-pos="${st.p}"]`);if(r)targets.push([r,st.out]);
  if(st.carryOut){const cr=$(`#alg6 .carryinput6[data-pos="${st.p+1}"]`);if(cr)targets.push([cr,st.carryOut])}
  let all=true;
  targets.forEach(([inp,exp])=>{inp.classList.remove('right6','wrong6');if(inp.value!==String(exp)){inp.classList.add('wrong6');all=false}else inp.classList.add('right6')});
  if(!all){tries6++;soft();$('#fb6').className='colfeedback bad';$('#fb6').textContent=tx('Revisa las casillas rojas. Las verdes están bien.','Revisa les caselles roges. Les verdes estan bé.','Check the red boxes. The green ones are correct.');if(tries6>=2){$('#hint6text').innerHTML+=` <b>${tx('Recuerda: 10 unidades forman 1 decena; 10 decenas forman 1 centena.','Recorda: 10 unitats formen 1 desena; 10 desenes formen 1 centena.','Remember: 10 ones make 1 ten; 10 tens make 1 hundred.')}</b>`}return}
  targets.forEach(([inp])=>inp.disabled=true);ok();tries6=0;$('#fb6').className='colfeedback good';$('#fb6').textContent=tx('¡Ese paso está bien!','Eixe pas està bé!','That step is correct!');
  step6++;
  if(step6>=c.steps.length){done6=true;confetti();say(c.ans);$('#m6').textContent=`${a6} + ${b6} = ${c.ans} 🎉`;$('#go6').textContent=t('another');draw6();updateHint6();return}
  draw6();updateHint6();setTimeout(()=>{const nx=$(`#alg6 .resinput6[data-pos="${activeStep6().p}"]`);if(nx)nx.focus()},120);
}
$('#go6').onclick=check6;
$('#new6').onclick=random6;

/* Utilidades de juegos */
function options(ans,n){const s=new Set([ans]),st=D===1?[1,2,3]:D===2?[1,10,2,20]:[1,10,100,20,200];let g=0;while(s.size<n&&g++<300){const c=ans+(Math.random()<.5?-1:1)*st[rnd(0,st.length-1)];if(c>=0)s.add(c)}return[...s].sort(()=>Math.random()-.5)}
const medals=[[5,'🥉'],[15,'🥈'],[30,'🥇'],[50,'🏆']];
const COL=['#fff','#f4f4f4','#ff6b6b','#2fbf71','#e05fd0','#ffc93c','#1f9d55','#555','#7a4a2a','#3d9bff','#ff9f1c'];
const rod=n=>`<div class="rod" style="--c:${COL[n]||'#8a63f2'}">${'<i></i>'.repeat(n)}</div>`;
const vis=n=>n>10?blocks(n):rod(n);
const cubes=(a,b)=>`<div class="cub">${'<i style="background:var(--r)"></i>'.repeat(a)}<em></em>${'<i style="background:var(--b)"></i>'.repeat(b)}</div>`;
const optBtn=(v,fn)=>{const x=document.createElement('button');x.className='opt';x.textContent=v;if(D>1)x.style.fontSize='30px';x.onclick=()=>fn(x,v);return x};

/* Apartado 4 */
let mx4=5,ok4=0,str4=0,cur4,lock4=false;
function r4(){lock4=false;let a,b;if(D===1){a=rnd(1,mx4);b=rnd(1,mx4)}else{const lo=10**(D-1),cap=10**D-1,phase=Math.min(3,1+Math.floor(ok4/4));a=rnd(lo,Math.max(lo,cap-(D===2?20:100)));if(phase===1)b=rnd(1,9);else if(phase===2)b=(D===2?10:10)*rnd(1,Math.min(9,Math.floor((cap-a)/10)));else b=rnd(1,Math.max(1,cap-a));if(a+b>cap)b=cap-a}pa=a;pb=b;cur4=a+b;emo=EM[rnd(0,5)];panel(a,b);
  $('#m4').textContent=t('how');$('#o4').innerHTML='';options(cur4,3).forEach(v=>$('#o4').appendChild(optBtn(v,ans4)));
  $('#s4l').textContent=t('lvl')+' '+(mx4-4);const m=medals.filter(x=>ok4>=x[0]).pop();$('#s4s').textContent='⭐ '+ok4;$('#s4m').textContent='🏅 '+(m?m[1]:'—')}
async function ans4(btn,v){if(lock4)return;
  if(v===cur4){lock4=true;btn.classList.add('ok');ok();confetti();ok4++;str4++;$('#m4').textContent=t('good');$('#prow').classList.add('joined');$('#panel .eq').textContent=`${pa} + ${pb} = ${cur4}`;say(cur4);
    if(str4%3===0&&mx4<10){mx4++;$('#m4').textContent=t('up')}
    if(medals.some(x=>x[0]===ok4))$('#m4').textContent=t('medal');
    await sl(1900);r4()}
  else{soft();str4=0;btn.classList.add('no');btn.disabled=true;$('#m4').textContent=t('again');if(blk)say(`${pa} ${t('plus')} ${pb}`);else await countPanel(T)}}

/* Apartado 5: Rápido (sin panel superior) */
let run5=0,sc5=0,rs5=0,t5,lock5;
$('#tm5').oninput=()=>$('#tv5').textContent=$('#tm5').value;
$('#go5').onclick=()=>{run5++;sc5=0;rs5=0;$('#g5').style.display='block';$('#go5').textContent=t('re');next5()};
function next5(){const id=run5,lo=D>1?10**(D-1):1,cap=10**D-1,hi=D>1?cap-1:5,a=rnd(lo,hi),b=rnd(1,Math.max(1,Math.min(D===1?5:cap-a,D===2?30:120))),lim=+$('#tm5').value,st={s:Date.now()};lock5=false;cur4=a+b;
  $('#rd5').innerHTML=$('#hint5').checked?vis(a)+'<b class="pl">+</b>'+vis(b)+(D===1?cubes(a,b):''):'';
  $('#q5').textContent=`${a} + ${b}`;$('#m5').textContent='';$('#s5s').textContent='🏆 '+sc5;$('#s5r').textContent='🔥 '+rs5;
  $('#o5').innerHTML='';options(cur4,4).forEach(v=>$('#o5').appendChild(optBtn(v,(x,v)=>fin5(x,v,id,lim,st))));
  const br=$('#br5');br.style.width='100%';br.style.background='var(--g)';clearInterval(t5);
  t5=setInterval(()=>{const l=Math.max(0,1-(Date.now()-st.s)/1000/lim);br.style.width=l*100+'%';if(l<.3)br.style.background='var(--r)';if(l<=0){clearInterval(t5);fin5(null,null,id,lim,st)}},100)}
async function fin5(btn,v,id,lim,st){if(lock5||id!==run5)return;lock5=true;clearInterval(t5);
  if(btn&&v===cur4){const p=10+Math.round(Math.max(0,lim-(Date.now()-st.s)/1000));sc5+=p;rs5++;btn.classList.add('ok');ok();confetti();$('#m5').textContent=t('great',p)}
  else{soft();rs5=0;$$('#o5 .opt').forEach(o=>{if(+o.textContent===cur4)o.classList.add('ok')});$('#m5').textContent=btn?t('almost',cur4):t('time',cur4)}
  $('#rd5').innerHTML=vis(cur4);$('#s5s').textContent='🏆 '+sc5;$('#s5r').textContent='🔥 '+rs5;await sl(1800);if(id===run5)next5()}

/* Navegación */
function go(n){cur=n;T++;run2++;run5++;clearInterval(t5);$('#panel').style.display=(n===5||n===6||(n===3&&D>1))?'none':'';
  $$('.sec').forEach(s=>s.classList.toggle('act',s.id==='s'+n));$$('#nav button').forEach(b=>b.classList.toggle('act',b.dataset.s==n));
  if(n==1)r1();if(n==2)r2();if(n==3)r3();if(n==4)r4();if(n==5){$('#g5').style.display='none';$('#go5').textContent=t('go')}if(n==6)r6()}
$$('#nav button').forEach(b=>b.onclick=()=>go(+b.dataset.s));
$$('#dg button').forEach(b=>b.onclick=()=>setD(+b.dataset.d));
$('#dg button').classList.add('sel');
applyLang();
</script>
