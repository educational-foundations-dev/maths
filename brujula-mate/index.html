function normalizeMath(s){

 x=x.replace(/\\frac\s*\{\s*([^{}]+)\s*\}\s*\{\s*([^{}]+)\s*\}/g,'($1)/($2)');
 const glyphs={'½':'(1/2)','⅓':'(1/3)','⅔':'(2/3)','¼':'(1/4)','¾':'(3/4)','⅛':'(1/8)','⅜':'(3/8)','⅝':'(5/8)','⅞':'(7/8)','⅚':'(5/6)','⅕':'(1/5)','⅖':'(2/5)','⅗':'(3/5)','⅘':'(4/5)','⅙':'(1/6)','⅐':'(1/7)','⅑':'(1/9)','⅒':'(1/10)'};
 x=x.replace(/[½⅓⅔¼¾⅛⅜⅝⅞⅚⅕⅖⅗⅘⅙⅐⅑⅒]/g,(v,i,str)=>{const prev=str[i-1]||'';return /[0-9)]/.test(prev)?'+'+glyphs[v]:glyphs[v]});

 x=x.replace(/(\d)\s*:\s*(\d)/g,'$1/$2');
 x=x.replace(/\s/g,'');
 // Spanish and international decimal separators. Grouped thousands allowed only with clear decimal comma.
 if(/^\d{1,3}(?:\.\d{3})+,\d+$/.test(x))x=x.replace(/\./g,'').replace(',','.');
 else x=x.replace(/,/g,'.');
 x=x.replace(/(cm²|cm³|mm²|m²|m³|km|mm|cm|ml|kg|g|euros?|horas?|minutos?|segundos?|h|min|s|€)$/,'');
 return x;
}
function parseExpression(str){
 const x=normalizeMath(str);if(!x||!/^[0-9.+\-*/^()%]+$/.test(x))return NaN;
 let pos=0;const take=ch=>{if(x[pos]===ch){pos++;return true}return false};
 function atom(){if(take('(')){const v=add();if(!take(')'))throw Error('paren');return v}
  const m=x.slice(pos).match(/^(?:\d+(?:\.\d*)?|\.\d+)/);if(!m)throw Error('num');pos+=m[0].length;return Number(m[0])}
 function power(){let a=atom();if(take('^'))a=Math.pow(a,signed());while(take('%'))a/=100;return a}
 function signed(){if(take('+'))return signed();if(take('-'))return -signed();return power()}
 function prod(){let v=signed();for(;;){if(take('*'))v*=signed();else if(take('/'))v/=signed();else break}return v}
 function add(){let v=prod();for(;;){if(take('+'))v+=prod();else if(take('-'))v-=prod();else break}return v}
 try{const n=add();return pos===x.length&&Number.isFinite(n)?n:NaN}catch(e){return NaN}
}
function parseNumber(s){const t=String(s??'').trim();if(!t)return NaN;
 const pieces=t.split(/\s*(?:=|≃|≈)\s*/);if(pieces.length>1){
  if(pieces.length>5)return NaN;
  const nums=pieces.map(parseExpression);if(nums.some(n=>!Number.isFinite(n)))return NaN;
  if(!nums.every(n=>close(n,nums[0],1e-8)))return NaN;

function close(a,b,tolerance=1e-8){return Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)<=tolerance*Math.max(1,Math.abs(b))}
function normText(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/\s+/g,'')}
function expressionFingerprint(expr){const x=normalizeMath(expr).replace(/[()]/g,'');const nums=(x.match(/\d+(?:\.\d+)?/g)||[]).sort().join(',');const ops=(x.match(/[+*/^\-]/g)||[]).sort().join('');return nums+'|'+ops}
function acceptedEquation(value,expectedProof){

function pdfLiteral(str){

 let s=String(str??'');s=s.replace(/[²³×÷−≥≤→√∑∫∞□◦]/g,x=>replacement[x]||x);let result='';
 for(let i=0;i<s.length;i++){let c=s[i],k=cp[c]??c.charCodeAt(0);if(c==='('||c===')'||c==='\\')result+='\\'+c;else if(k>=32&&k<=126)result+=c;else if(k>=128&&k<=255)result+='\\'+k.toString(8).padStart(3,'0');else if(c==='\n')result+=' ';else result+='?'}

function pdfWrap(text,width,pt){let out=[];for(const paragraph of String(text).split('\n')){if(!paragraph.trim()){out.push('');continue}let words=paragraph.split(/\s+/),line='';for(let w of words){let test=line?line+' '+w:w;if(stringWidth(test,pt)>width&&line){out.push(line);line=w}else line=test}out.push(line)}return out}
class PDFReport{

 endPage(){const contents=this.commands.join('\n')+'\n';const cid=this.obj(`<< /Length ${contents.length} >>\nstream\n${contents}endstream`);const page=this.obj(`<< /Type /Page /Parent ${this.pagesRef} 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${this.regular} 0 R /F2 ${this.bold} 0 R >> >> /Contents ${cid} 0 R >>`);this.pages.push(page);this.commands=[]}

function rgb(hex){const h=hex.replace('#','');return [0,2,4].map(i=>(parseInt(h.substring(i,i+2),16)/255).toFixed(3)).join(' ')}

async function importPDF(file){try{
 if(file.size>20*1024*1024)throw Error('Archivo demasiado grande (máximo 20 MB).');
 let data=await file.arrayBuffer(),bytes=new Uint8Array(data);
 let chars='';for(let i=0;i<bytes.length;i+=32768)chars+=String.fromCharCode(...bytes.slice(i,i+32768));
 if(!chars.startsWith('%PDF-'))throw Error('El archivo no es un PDF válido.');
 const m=chars.match(/DIAGMATH_STATE_BEGIN:([A-Za-z0-9+/=]+):DIAGMATH_STATE_END/);
 if(!m)throw Error('Este PDF no contiene datos recuperables de Brújula Matemática. Importa un informe exportado desde la aplicación.');
 let state=JSON.parse(new TextDecoder().decode(base64Bytes(m[1])));
 if(state.app!=='brujula-matematica'||![1,2].includes(state.schema))throw Error('Formato de informe incompatible.');
 let imported=state.schema===2&&Array.isArray(state.records)?state.records:[state.record];
 if(!imported.length||imported.length>200)throw Error('Número de evaluaciones no válido.');
 for(const r of imported){if(!r?.id||!Array.isArray(r.qids)||typeof r.answers!=='object'||!r.answers||!r.qids.length||r.qids.length>120||!r.qids.every(id=>BY_ID[id])||typeof r.key!=='string')throw Error('El informe contiene una evaluación incompatible.');}
 const collisions=imported.filter(r=>records.some(x=>x.id===r.id));
 if(collisions.length&&!confirm(`Hay ${collisions.length} evaluaciones que ya existen. ¿Deseas actualizarlas con las del PDF?`))return;
 for(const r of imported){const idx=records.findIndex(x=>x.id===r.id);if(idx>=0)records[idx]=r;else records.push(r)}
 persist();const chosen=state.record||imported.at(-1);selectedReport=chosen.id;
 if(!chosen.completed){currentId=chosen.id;qindex=0;viewChange('test')}else viewChange('report');
 toast(`Importadas ${imported.length} evaluaciones. El perfil curricular acumulado está disponible.`);
 }catch(e){console.error(e);toast('No se pudo importar: '+e.message)}
}
render();
